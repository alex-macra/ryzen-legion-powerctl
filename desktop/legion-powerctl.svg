<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Rounded plate in Breeze charcoal with the CachyOS emerald accent. -->
  <rect x="8" y="8" width="112" height="112" rx="22" fill="#232629"/>
  <rect x="8" y="8" width="112" height="112" rx="22" fill="none" stroke="#12bfa5" stroke-opacity="0.35" stroke-width="2"/>
  <!-- Gauge arc: a circle stroked for three quarters of its circumference. -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3a3f44" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="188.5 62.8"
          transform="rotate(135 64 64)"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="#12bfa5" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="132 119.3"
          transform="rotate(135 64 64)"/>
  <!-- Lightning bolt. -->
  <polygon points="70,30 46,70 61,70 55,98 82,58 66,58"
           fill="#eff0f1" stroke="#232629" stroke-width="2" stroke-linejoin="round"/>
</svg>
