# Gaming and anything else that loads the CPU and GPU together. The CPU and GPU share one
# power and cooling envelope, so restraint here is what leaves budget for the GPU; raising
# these values in a GPU-bound game can cost frames. Starts as a copy of balanced-plus
# because that is the only setting with any evidence behind it, informal though it is.
# docs/TUNING.md section 7 explains the arithmetic and how to measure it.
DESCRIPTION="Gaming and other CPU+GPU load: contains CPU heat so the GPU keeps its share of the envelope."
STAPM_W=65
SLOW_W=70
FAST_W=80
TEMP_C=78
POWER_PROFILE=balanced
MIN_FREQ_MHZ=stock
MAX_FREQ_MHZ=stock
BOOST=on
EPP=balance_performance
